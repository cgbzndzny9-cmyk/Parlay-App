<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
   <title>Sharpshooter Mobile Elite</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <script src="https://unpkg.com/lucide@latest"></script>
   <style>
       .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
       body { -webkit-tap-highlight-color: transparent; }
   </style>
</head>
<body class="bg-[#020617] text-slate-100 min-h-screen font-sans pb-10">

   <header class="p-4 border-b border-slate-800 glass sticky top-0 z-50 flex justify-between items-center">
       <h1 class="font-black italic text-lg uppercase tracking-tighter">Sharpshooter <span class="text-emerald-400 not-italic">2025</span></h1>
       <input type="password" id="apiKey" placeholder="API Key" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1 text-xs outline-none w-24 focus:w-40 transition-all">
   </header>

   <main class="p-4 space-y-6">

       <section>
           <div class="flex justify-between items-center mb-4">
               <h2 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Live +EV Feed</h2>
               <button onclick="refreshData()" class="text-emerald-400 text-xs font-bold flex items-center gap-1">
                   <i data-lucide="refresh-cw" class="w-3 h-3"></i> REFRESH
               </button>
           </div>
           <div id="market-grid" class="space-y-3">
               <div class="p-8 text-center border border-dashed border-slate-800 rounded-2xl text-slate-600 text-sm">Enter API Key to sync live odds</div>
           </div>
       </section>

       <section class="glass p-5 rounded-3xl border-emerald-500/20">
           <h3 class="font-bold flex items-center gap-2 mb-4">
               <i data-lucide="wallet" class="w-4 h-4 text-emerald-400"></i> Kelly Bankroll Manager
           </h3>
           <div class="grid grid-cols-2 gap-4">
               <div>
                   <label class="text-[10px] text-slate-500 font-bold uppercase block mb-1">Total Bankroll</label>
                   <input type="number" id="kelly-bankroll" value="1000" oninput="runKelly()" class="w-full bg-slate-800 border-none p-2 rounded-lg font-mono text-emerald-400">
               </div>
               <div>
                   <label class="text-[10px] text-slate-500 font-bold uppercase block mb-1">Win Prob. (%)</label>
                   <input type="number" id="kelly-prob" value="55" oninput="runKelly()" class="w-full bg-slate-800 border-none p-2 rounded-lg font-mono text-emerald-400">
               </div>
           </div>
           <div class="mt-4 bg-emerald-500/10 p-4 rounded-xl flex justify-between items-center">
               <div>
                   <p class="text-[10px] text-emerald-500/60 font-bold uppercase">Suggested Stake</p>
                   <p id="kelly-suggestion" class="text-xl font-mono font-bold text-emerald-400">$0.00</p>
               </div>
               <div class="text-right">
                   <p id="kelly-percent" class="text-xs font-bold text-white">0% of Wallet</p>
               </div>
           </div>
       </section>

       <section class="glass p-5 rounded-3xl">
           <h3 class="font-bold mb-4">Hedge Lock</h3>
           <div class="space-y-4">
               <input type="number" id="h-payout" placeholder="Parlay Payout Amount" oninput="calcHedge()" class="w-full bg-slate-900 p-3 rounded-xl text-sm border border-slate-800">
               <input type="number" id="h-odds" placeholder="Opposite Leg Odds (+150)" oninput="calcHedge()" class="w-full bg-slate-900 p-3 rounded-xl text-sm border border-slate-800">
               <div id="hedge-result" class="hidden p-3 bg-slate-800 rounded-xl flex justify-between items-center animate-in fade-in">
                   <span class="text-xs text-slate-400">Hedge Bet: <b id="h-wager" class="text-white"></b></span>
                   <span class="text-xs text-emerald-400 font-bold">Profit: <b id="h-profit"></b></span>
               </div>
           </div>
       </section>

   </main>

   <script>
       // API & Grid Functions
       async function refreshData() {
           const key = document.getElementById('apiKey').value;
           if (!key) return alert("API Key Required");
           const grid = document.getElementById('market-grid');
           grid.innerHTML = '<div class="text-center py-10 animate-pulse text-slate-500 uppercase text-[10px] tracking-widest font-bold">Scanning Markets...</div>';

           try {
               const response = await fetch(`https://api.the-odds-api.com/v4/sports/americanfootball_nfl/odds/?apiKey=${key}&regions=us&markets=h2h&oddsFormat=american`);
               const data = await response.json();
               renderGrid(data);
           } catch (err) { alert("Fetch failed"); }
       }

       function renderGrid(data) {
           const grid = document.getElementById('market-grid');
           grid.innerHTML = data.slice(0, 6).map(m => `
               <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                   <div>
                       <p class="text-[10px] text-slate-500 font-bold uppercase">${m.home_team} vs ${m.away_team}</p>
                       <p class="font-bold text-sm">${m.bookmakers[0].markets[0].outcomes[0].name}</p>
                   </div>
                   <span class="text-emerald-400 font-mono font-bold">${m.bookmakers[0].markets[0].outcomes[0].price}</span>
               </div>
           `).join('');
       }

       // Kelly Criterion Logic
       function runKelly() {
           const bankroll = parseFloat(document.getElementById('kelly-bankroll').value);
           const prob = parseFloat(document.getElementById('kelly-prob').value) / 100;
           const odds = 1.91; // Default -110 juice, can be dynamic

           const b = odds - 1;
           const q = 1 - prob;
           const fraction = ((b * prob) - q) / b;

           const suggestion = fraction > 0 ? bankroll * fraction * 0.5 : 0; // "Fractional Kelly" at 0.5 for safety

           document.getElementById('kelly-suggestion').innerText = `$${suggestion.toFixed(2)}`;
           document.getElementById('kelly-percent').innerText = `${((suggestion/bankroll)*100).toFixed(1)}% of Wallet`;
       }

       // Hedge Logic
       function calcHedge() {
           const payout = parseFloat(document.getElementById('h-payout').value);
           const odds = parseFloat(document.getElementById('h-odds').value);
           if (payout && odds) {
               document.getElementById('hedge-result').classList.remove('hidden');
               const dec = odds > 0 ? (odds/100)+1 : 1+(100/Math.abs(odds));
               const wager = payout / dec;
               document.getElementById('h-wager').innerText = `$${wager.toFixed(2)}`;
               document.getElementById('h-profit').innerText = `$${(payout - wager).toFixed(2)}`;
           }
       }

       lucide.createIcons();
   </script>
</body>
</html>
